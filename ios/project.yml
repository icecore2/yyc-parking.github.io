name: CalgaryParkingMap
options:
  bundleIdPrefix: com.calgaryparking
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.9"
  ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  CalgaryParkingMap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CalgaryParkingMap
    info:
      path: CalgaryParkingMap/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.calgaryparking.map
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Calgary Parking Map uses your location to calculate walking distance and find nearby parking stalls."
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CalgaryParkingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CalgaryParkingTests
    dependencies:
      - target: CalgaryParkingMap
